services:
  leadforge-api:
    image: ghcr.io/muhammedadebiyi/leadforge/api:latest
    container_name: leadforge-api
    restart: unless-stopped
    env_file: .env.production
    networks:
      - leadforge-net

  leadforge-email-worker:
    image: ghcr.io/muhammedadebiyi/leadforge/email-worker:latest
    container_name: leadforge-email-worker
    restart: unless-stopped
    env_file: .env.production
    networks:
      - leadforge-net

  leadforge-telegram-worker:
    image: ghcr.io/muhammedadebiyi/leadforge/telegram-worker:latest
    container_name: leadforge-telegram-worker
    restart: unless-stopped
    env_file: .env.production
    networks:
      - leadforge-net

  leadforge-export-worker:
    image: ghcr.io/muhammedadebiyi/leadforge/export-worker:latest
    container_name: leadforge-export-worker
    restart: unless-stopped
    env_file: .env.production
    networks:
      - leadforge-net

  leadforge-website-worker:
    image: ghcr.io/muhammedadebiyi/leadforge/website-worker:latest
    restart: unless-stopped
    env_file: .env.production
    deploy:
      replicas: 4
    networks:
      - leadforge-net

  leadforge-search-worker:
    image: ghcr.io/muhammedadebiyi/leadforge/search-worker:latest
    restart: unless-stopped
    env_file: .env.production
    deploy:
      replicas: 4
    networks:
      - leadforge-net

  caddy:
    image: caddy:2-alpine
    container_name: leadforge-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - leadforge-net
      - notificationhub-net

  dozzle:
    image: amir20/dozzle:latest
    container_name: leadforge-dozzle
    restart: unless-stopped
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - leadforge-net

networks:
  leadforge-net:
    driver: bridge
  notificationhub-net:
    external: true

volumes:
  caddy_data:
  caddy_config: